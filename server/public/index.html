<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SonicAccess — occupancy</title>
<style>
  /* Quezon City University palette: blue / white / red / gold */
  :root {
    color-scheme: light;
    --blue: #0B3C8C; --blue-dark: #082C66; --blue-tint: #E7EEF9;
    --gold: #F2B705; --gold-deep: #C8930A;
    --red: #C8102E; --red-tint: #FBE7EA;
    --paper: #F4F6FB; --ink: #141B2D; --mute: #5A6478; --faint: #8A93A6; --line: #DDE3EE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--paper); color: var(--ink); padding: 0 0 40px;
  }
  .bar {
    background: var(--blue); color: #fff; padding: 14px 24px;
    display: flex; align-items: baseline; gap: 12px;
  }
  .bar .mark { font-weight: 800; font-size: 18px; letter-spacing: .3px; }
  .bar .mark span { color: var(--gold); }
  .bar .tag { color: #C9D6EE; font-size: 12.5px; font-weight: 600; letter-spacing: .4px; }
  .wrap { max-width: 940px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 2px; font-weight: 700; }
  .sub { color: var(--mute); font-size: 13px; margin-bottom: 18px; }
  .count {
    font-size: 92px; font-weight: 800; line-height: 1; letter-spacing: 1px; color: var(--blue);
  }
  .count.stale { color: var(--red); }
  .today { color: var(--mute); margin: 10px 0 26px; font-size: 14px; }
  .today b { color: var(--ink); }
  .grid { display: grid; gap: 20px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card {
    background: #fff; border-radius: 14px; padding: 18px;
    border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(11,27,58,.06);
  }
  .card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--blue); margin: 0 0 12px; font-weight: 700;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--faint); font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: .5px; }
  tr:last-child td { border-bottom: 0; }
  .badge { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .ok { background: var(--blue-tint); color: var(--blue-dark); }
  .stalebadge { background: var(--red-tint); color: var(--red); }
  .dir-in { color: var(--blue); font-weight: 700; } .dir-out { color: var(--red); font-weight: 700; }
  button, input { font: inherit; }
  input {
    background: #fff; border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 8px 10px;
  }
  button {
    background: var(--blue); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 14px; cursor: pointer; font-weight: 700;
  }
  button.secondary { background: #fff; color: var(--blue); border: 1.5px solid var(--blue); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .err { color: var(--red); font-size: 13px; margin-top: 8px; }
  .foot { color: var(--faint); font-size: 12px; margin-top: 26px; }
  a { color: var(--blue); }
</style>
</head>
<body>
  <div class="bar">
    <span class="mark">Sonic<span>Access</span></span>
    <span class="tag">Quezon City University</span>
  </div>
  <div class="wrap">
  <h1>Campus occupancy</h1>
  <div class="sub" id="sub">connecting…</div>

  <div class="count" id="count">–</div>
  <div class="today" id="today"></div>

  <div class="grid">
    <div class="card">
      <h2>Gate nodes</h2>
      <table><thead><tr><th>Gate</th><th>Dir</th><th>Last seen</th><th></th></tr></thead>
      <tbody id="nodes"><tr><td colspan="4">–</td></tr></tbody></table>
    </div>
    <div class="card">
      <h2>Recent events</h2>
      <table><thead><tr><th>Student</th><th>Gate</th><th>Dir</th><th>When</th></tr></thead>
      <tbody id="events"><tr><td colspan="4">–</td></tr></tbody></table>
    </div>
  </div>

  <div class="card" style="max-width:900px;margin-top:20px">
    <h2>Operator controls (admin token)</h2>
    <div class="controls">
      <input id="adminTok" type="password" placeholder="ADMIN_TOKEN (optional)" size="28" />
      <input id="adjDelta" type="number" placeholder="±n" style="width:80px" />
      <button id="adjBtn" class="secondary">Adjust</button>
      <button id="resetBtn" class="secondary">Reset to 0</button>
    </div>
    <div class="err" id="ctlErr"></div>
  </div>

  <div class="err" id="err"></div>
  <div class="foot">
    auto-refresh 5 s · <a href="#" id="logout">change token</a>
  </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let READ = localStorage.getItem('sa_read') || '';

function ask() {
  const t = prompt('READ_TOKEN (from server/.env):', READ || '');
  if (t === null) return;
  READ = t.trim();
  localStorage.setItem('sa_read', READ);
}
if (!READ) ask();

async function api(path, opts = {}) {
  const headers = Object.assign({ authorization: 'Bearer ' + READ }, opts.headers || {});
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) { $('err').textContent = 'token rejected — click "change token"'; throw new Error('401'); }
  if (!r.ok) throw new Error(path + ' -> ' + r.status);
  return r.json();
}

function rel(iso) {
  if (!iso) return '—';
  const s = Math.round((Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  return Math.round(s / 3600) + 'h ago';
}

async function tick() {
  try {
    const [occ, nodes, ev] = await Promise.all([
      api('/occupancy'),
      api('/nodes'),
      api('/occupancy/events?limit=12'),
    ]);
    $('err').textContent = '';
    const anyStale = nodes.nodes.some((n) => n.stale) || nodes.nodes.length === 0;
    $('count').textContent = occ.count;
    $('count').className = 'count' + (anyStale ? ' stale' : '');
    $('today').innerHTML =
      `today &nbsp; in <b>${occ.today.in}</b> &nbsp; out <b>${occ.today.out}</b> &nbsp; net <b>${occ.today.net}</b>` +
      ` &nbsp;·&nbsp; last event ${rel(occ.lastEventAt)}`;
    $('sub').textContent = 'updated ' + new Date().toLocaleTimeString();

    $('nodes').innerHTML = nodes.nodes.length
      ? nodes.nodes.map((n) =>
          `<tr><td>${n.gateId}</td><td>${n.direction}</td><td>${rel(n.lastSeenAt)}</td>` +
          `<td><span class="badge ${n.stale ? 'stalebadge' : 'ok'}">${n.stale ? 'stale' : 'ok'}</span></td></tr>`
        ).join('')
      : '<tr><td colspan="4">no nodes have checked in</td></tr>';

    $('events').innerHTML = ev.events.length
      ? ev.events.map((e) =>
          `<tr><td>${e.studentId}</td><td>${e.gateId}</td>` +
          `<td class="dir-${e.direction}">${e.direction}</td><td>${rel(e.eventTs)}</td></tr>`
        ).join('')
      : '<tr><td colspan="4">none</td></tr>';
  } catch (e) {
    if (String(e.message) !== '401') $('err').textContent = String(e.message);
  }
}

async function adminPost(path, body) {
  const tok = $('adminTok').value.trim();
  if (!tok) { $('ctlErr').textContent = 'enter ADMIN_TOKEN first'; return; }
  $('ctlErr').textContent = '';
  try {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + tok },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!r.ok) { $('ctlErr').textContent = j.error || ('HTTP ' + r.status); return; }
    tick();
  } catch (e) { $('ctlErr').textContent = String(e.message); }
}

$('adjBtn').onclick = () => {
  const d = parseInt($('adjDelta').value, 10);
  if (!d) { $('ctlErr').textContent = 'enter a non-zero delta'; return; }
  adminPost('/occupancy/adjust', { delta: d, reason: 'dashboard' });
};
$('resetBtn').onclick = () => {
  if (confirm('Reset occupancy to 0?')) adminPost('/occupancy/reset', { to: 0, reason: 'dashboard' });
};
$('logout').onclick = (e) => { e.preventDefault(); ask(); tick(); };

tick();
setInterval(tick, 5000);
</script>
</body>
</html>
